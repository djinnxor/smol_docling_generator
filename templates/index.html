<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Docling Tag Labeler</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --accent2: #533483;
    --text: #eaeaea;
    --text2: #a0a0b0;
    --border: #2a2a4a;
    --success: #4caf50;
    --warning: #ff9800;
    --radius: 6px;
    --sidebar-w: 340px;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Toolbar ────────────────────────────────────────────────── */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  #toolbar h1 { font-size: 1.1rem; color: var(--accent); white-space: nowrap; }

  .btn {
    padding: 6px 14px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--surface2); color: var(--text); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-warning { background: var(--warning); color: #fff; }
  .btn-danger { background: #f44336; color: #fff; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  #file-label {
    padding: 6px 14px;
    border-radius: var(--radius);
    background: var(--surface2);
    cursor: pointer;
    font-size: .85rem;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  #file-label:hover { border-color: var(--accent); }
  #pdf-input { display: none; }

  #status-bar {
    font-size: .8rem;
    color: var(--text2);
    margin-left: auto;
  }
  #status-bar.error { color: #f44336; }
  #status-bar.ok { color: var(--success); }

  #ocr-model-select {
    width: auto;
    padding: 6px 10px;
    font-size: .82rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    cursor: pointer;
  }
  #ocr-model-select:focus { border-color: var(--accent); }

  #removed-overlay {
    position: absolute;
    inset: 0;
    background: rgba(244,67,54,.15);
    border: 3px dashed #f44336;
    pointer-events: none;
    display: none;
    z-index: 5;
  }
  #removed-overlay span {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #f44336cc;
    color: #fff;
    font-size: 1.4rem;
    font-weight: 700;
    padding: 12px 28px;
    border-radius: var(--radius);
    letter-spacing: .05em;
    pointer-events: none;
  }

  /* ── Main layout ─────────────────────────────────────────────── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Canvas panel ────────────────────────────────────────────── */
  #canvas-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #0d0d1a;
  }

  #page-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #page-info { font-size: .85rem; color: var(--text2); min-width: 80px; text-align: center; }

  #mode-buttons {
    display: flex;
    gap: 6px;
    margin-left: auto;
  }
  .mode-btn { padding: 5px 12px; font-size: .8rem; border-radius: var(--radius); border: 1px solid var(--border); cursor: pointer; background: var(--surface2); color: var(--text2); transition: all .15s; }
  .mode-btn.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }

  #viewport {
    flex: 1;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
  }

  #canvas-container {
    position: relative;
    display: inline-block;
    box-shadow: 0 4px 24px #0006;
  }

  #page-img {
    display: block;
    max-width: 100%;
    user-select: none;
    pointer-events: none;
  }

  #overlay-canvas {
    position: absolute;
    top: 0; left: 0;
    cursor: crosshair;
  }

  /* ── Sidebar ──────────────────────────────────────────────────── */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  #sidebar-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn { flex: 1; padding: 10px; font-size: .82rem; font-weight: 600; border: none; background: transparent; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--bg); }

  .tab-pane { display: none; flex: 1; overflow-y: auto; padding: 12px; }
  .tab-pane.active { display: flex; flex-direction: column; gap: 10px; }

  /* Elements tab */
  #elements-list { display: flex; flex-direction: column; gap: 6px; }

  .element-item {
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    border-radius: var(--radius);
    padding: 8px 10px;
    cursor: pointer;
    transition: border-color .15s, background .15s, box-shadow .15s;
    font-size: .8rem;
  }
  .element-item:hover { background: var(--bg); border-left-color: var(--text2); }
  .element-item.selected {
    border-color: var(--accent);
    border-left: 4px solid var(--accent);
    background: #3a0a24;
    box-shadow: 0 0 0 1px var(--accent) inset, 0 2px 12px rgba(233,69,96,.25);
  }

  .el-label {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 3px;
    font-size: .72rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 3px;
  }
  .el-content {
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  /* Edit tab */
  #edit-pane label { font-size: .8rem; color: var(--text2); display: block; margin-bottom: 3px; }
  #edit-pane .field { margin-bottom: 10px; }

  select, textarea, input[type=number] {
    width: 100%;
    padding: 7px 9px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: .85rem;
    outline: none;
  }
  select:focus, textarea:focus, input[type=number]:focus { border-color: var(--accent); }

  textarea { resize: vertical; min-height: 80px; font-family: inherit; }

  .bbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .bbox-grid label { font-size: .72rem; color: var(--text2); }
  .bbox-grid .bbox-field { display: flex; flex-direction: column; gap: 3px; }

  .edit-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .edit-actions .btn { flex: 1; min-width: 80px; font-size: .8rem; padding: 7px; }

  #no-selection { color: var(--text2); font-size: .85rem; text-align: center; padding: 20px 0; }

  /* Legend */
  #legend { display: flex; flex-direction: column; gap: 5px; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: .8rem; }
  .legend-color { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
  .legend-section-header {
    font-size: .7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--text2);
    padding: 8px 0 3px;
    border-bottom: 1px solid var(--border);
    margin-top: 4px;
  }
  .legend-section-header:first-child { padding-top: 2px; margin-top: 0; }

  /* Stats */
  #stats-content { font-size: .82rem; color: var(--text2); line-height: 1.8; }
  #stats-content strong { color: var(--text); }

  /* Save area */
  #save-area { padding: 12px; border-top: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
  #save-area .btn { width: 100%; }
  #save-path-info {
    font-size: .72rem;
    color: var(--text2);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 8px;
    display: none;
    word-break: break-all;
    line-height: 1.5;
  }
  #save-path-info strong { color: var(--success); display: block; margin-bottom: 2px; }
  #save-path-info .copy-btn {
    display: inline-block;
    margin-top: 4px;
    padding: 2px 8px;
    border-radius: 3px;
    background: var(--surface2);
    color: var(--text);
    border: none;
    cursor: pointer;
    font-size: .72rem;
  }

  /* Resize handle */
  #resize-handle {
    width: 5px;
    background: var(--border);
    cursor: col-resize;
    flex-shrink: 0;
    transition: background .15s;
    position: relative;
    z-index: 10;
  }
  #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }

  /* Table preview */
  #table-preview {
    display: none;
    margin-top: 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  #table-preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    background: var(--surface2);
    font-size: .78rem;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
  }
  #table-preview-header:hover { background: var(--accent2); }
  #table-preview-body {
    overflow: auto;
    max-height: 320px;
    padding: 8px;
    background: var(--bg);
  }
  #table-preview-body table {
    border-collapse: collapse;
    font-size: .78rem;
    color: var(--text);
    width: 100%;
    border: 2px solid rgba(160,170,220,0.7);
  }
  #table-preview-body th, #table-preview-body td {
    border: 1px solid rgba(160,170,220,0.5);
    padding: 4px 7px;
    white-space: pre-wrap;
    vertical-align: top;
  }
  #table-preview-body th {
    background: var(--surface2);
    color: #fff;
    font-weight: 600;
  }
  #table-preview-body td { background: var(--bg); }
  #table-preview-body tr:nth-child(even) td { background: #16213e55; }
  .table-preview-empty { color: var(--text2); font-size: .8rem; font-style: italic; }

  /* Spinner */
  #spinner {
    display: none;
    position: fixed;
    inset: 0;
    background: #0009;
    z-index: 999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 16px;
  }
  #spinner.show { display: flex; }
  .spinner-ring {
    width: 50px; height: 50px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: .85rem;
    opacity: 0;
    transition: opacity .3s, transform .3s;
    pointer-events: none;
    z-index: 1000;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.success { background: #1a3d1a; border: 1px solid var(--success); color: #6fff6f; }
  #toast.error { background: #3d1a1a; border: 1px solid #f44336; color: #ff8080; }

  /* Empty state */
  #empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text2);
    pointer-events: none;
  }
  #empty-state .big-icon { font-size: 3rem; }
  #empty-state p { font-size: .9rem; text-align: center; max-width: 220px; }
</style>
</head>
<body>

<!-- ── Toolbar ─────────────────────────────────────────────────── -->
<div id="toolbar">
  <h1>🏷️ Docling Tag Labeler</h1>
  <label class="btn btn-secondary" id="file-label">
    📂 Open PDF
    <input type="file" id="pdf-input" accept=".pdf" />
  </label>
  <button class="btn btn-primary" id="btn-process" onclick="processPDF()" disabled>⚡ Process with Docling</button>
  <select id="ocr-model-select" title="OCR model to use for text extraction">
    <option value="none">No OCR Override</option>
    <option value="google">Google Vision OCR</option>
    <option value="rapidocr">Docling OCR (RapidOCR)</option>
  </select>
  <span id="status-bar">No file loaded</span>
</div>

<!-- ── Main ───────────────────────────────────────────────────── -->
<div id="main">

  <!-- Canvas panel -->
  <div id="canvas-panel">
    <div id="page-nav">
      <button class="btn btn-secondary" onclick="changePage(-1)" id="btn-prev" disabled>◀ Prev</button>
      <span id="page-info">—</span>
      <button class="btn btn-secondary" onclick="changePage(1)" id="btn-next" disabled>Next ▶</button>
      <button class="btn btn-danger" onclick="removePage()" id="btn-remove-page" disabled title="Remove current page from annotations">🗑 Remove Page</button>
      <button class="btn btn-secondary" onclick="restorePage()" id="btn-restore-page" style="display:none" title="Restore removed page">↩ Restore Page</button>
      <button class="btn btn-secondary" onclick="redetectTables()" id="btn-redetect" disabled title="Re-run table detection on current page">🔍 Re-detect Tables</button>
      <div id="mode-buttons">
        <button class="mode-btn active" id="mode-select" onclick="setMode('select')" title="Select mode (click to pick an element)">↖ Select</button>
        <button class="mode-btn" id="mode-draw" onclick="setMode('draw')" title="Draw mode (drag to create new element)">✏️ Draw</button>
      </div>
    </div>

    <div id="viewport">
      <div id="canvas-container">
        <img id="page-img" src="" alt="" />
        <canvas id="overlay-canvas"></canvas>
        <div id="removed-overlay"><span>PAGE REMOVED</span></div>
        <div id="empty-state">
          <div class="big-icon">📄</div>
          <p>Open a PDF and click <strong>Process with Docling</strong> to start labeling.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Resize handle -->
  <div id="resize-handle" title="Drag to resize panels"></div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-tabs">
      <button class="tab-btn active" data-tab="elements" onclick="switchTab('elements')">Elements</button>
      <button class="tab-btn" data-tab="edit" onclick="switchTab('edit')">Edit</button>
      <button class="tab-btn" data-tab="legend" onclick="switchTab('legend')">Legend</button>
      <button class="tab-btn" data-tab="stats" onclick="switchTab('stats')">Stats</button>
    </div>

    <!-- Elements tab -->
    <div class="tab-pane active" id="tab-elements">
      <div id="elements-list">
        <p style="color:var(--text2);font-size:.82rem">No elements yet.</p>
      </div>
    </div>

    <!-- Edit tab -->
    <div class="tab-pane" id="tab-edit">
      <div id="no-selection">Click an element on the canvas<br/>or in the Elements list to edit it.</div>
      <div id="edit-form" style="display:none">
        <div class="field">
          <label>Tag Type</label>
          <select id="edit-label"></select>
        </div>
        <div class="field">
          <label>Content / Text</label>
          <textarea id="edit-content" rows="5"></textarea>
        </div>

        <!-- Table structure preview (visible for table elements only) -->
        <div id="table-preview">
          <div id="table-preview-header" onclick="toggleTablePreview()">
            📊 Table Structure <span id="table-preview-toggle">▼ show</span>
          </div>
          <div id="table-preview-body" style="display:none">
            <div id="table-preview-content"></div>
          </div>
        </div>
        <div class="field">
          <label>Bounding Box (normalised 0–1, top-left origin)</label>
          <div class="bbox-grid">
            <div class="bbox-field"><label>x1 (left)</label><input type="number" id="bbox-x1" step="0.001" min="0" max="1" /></div>
            <div class="bbox-field"><label>y1 (top)</label><input type="number" id="bbox-y1" step="0.001" min="0" max="1" /></div>
            <div class="bbox-field"><label>x2 (right)</label><input type="number" id="bbox-x2" step="0.001" min="0" max="1" /></div>
            <div class="bbox-field"><label>y2 (bottom)</label><input type="number" id="bbox-y2" step="0.001" min="0" max="1" /></div>
          </div>
        </div>
        <div class="edit-actions">
          <button class="btn btn-success" onclick="applyEdit()">✔ Apply</button>
          <button class="btn btn-danger" onclick="deleteSelected()">🗑 Delete</button>
          <button class="btn btn-secondary" onclick="deselectElement()">✕ Cancel</button>
          <button class="btn btn-secondary" id="btn-ocr-region" onclick="ocrRegion()" title="Run Google OCR on the selected element's region">🔍 OCR Region</button>
        </div>
      </div>
    </div>

    <!-- Legend tab -->
    <div class="tab-pane" id="tab-legend">
      <div id="legend"></div>
    </div>

    <!-- Stats tab -->
    <div class="tab-pane" id="tab-stats">
      <div id="stats-content">Process a PDF to see statistics.</div>
    </div>

    <!-- Save area -->
    <div id="save-area">
      <button class="btn btn-success" onclick="saveAnnotations()">💾 Save Annotations (JSON)</button>
      <button class="btn btn-secondary" onclick="exportXML()">📄 Export Annotations (XML)</button>
      <button class="btn btn-warning" onclick="addElement()">➕ Add New Element</button>
      <div id="save-path-info">
        <strong>✔ Saved</strong>
        <span id="save-path-text"></span>
        <button class="copy-btn" onclick="copyPath()" title="Copy full path" aria-label="Copy full file path to clipboard">📋 Copy path</button>
      </div>
    </div>
  </div>
</div>

<!-- Spinner overlay -->
<div id="spinner">
  <div class="spinner-ring"></div>
  <p>Processing with Docling…</p>
</div>

<!-- Toast notification -->
<div id="toast"></div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
const TAG_COLORS = {{ tag_colors | safe }};
const ALL_TAGS   = {{ tags | tojson }};

let state = {
  filename: '',
  pdfFilename: '',   // actual saved PDF filename for re-detection
  pages: {},          // { pageNum: [ element, ... ] }
  removedPages: new Set(),  // page numbers excluded from save/export
  currentPage: 1,
  totalPages: 0,
  selectedId: null,
  mode: 'select',     // 'select' | 'draw'
  drawing: false,
  drawStart: null,
  resizing: false,
  resizeCorner: null, // 'nw'|'ne'|'sw'|'se'
  imgNaturalW: 0,
  imgNaturalH: 0,
  pageDims: {},
};

// ─── DOM refs ─────────────────────────────────────────────────────────────────
const canvas    = document.getElementById('overlay-canvas');
const ctx       = canvas.getContext('2d');
const pageImg   = document.getElementById('page-img');
const emptyState = document.getElementById('empty-state');

// ─── Utility ──────────────────────────────────────────────────────────────────
function showSpinner(msg='Processing…') {
  document.querySelector('#spinner p').textContent = msg;
  document.getElementById('spinner').classList.add('show');
}
function hideSpinner() {
  document.getElementById('spinner').classList.remove('show');
}

function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.className = '', 3000);
}

function setStatus(msg, type='') {
  const el = document.getElementById('status-bar');
  el.textContent = msg;
  el.className = type;
}

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
}

function setMode(m) {
  state.mode = m;
  document.getElementById('mode-select').classList.toggle('active', m === 'select');
  document.getElementById('mode-draw').classList.toggle('active', m === 'draw');
  canvas.style.cursor = m === 'draw' ? 'crosshair' : 'default';
}

// ─── File handling ─────────────────────────────────────────────────────────────
document.getElementById('pdf-input').addEventListener('change', function() {
  if (this.files && this.files[0]) {
    setStatus('File: ' + this.files[0].name);
    document.getElementById('btn-process').disabled = false;
  }
});

async function processPDF() {
  const fileInput = document.getElementById('pdf-input');
  if (!fileInput.files || !fileInput.files[0]) {
    toast('Please select a PDF file first.', 'error'); return;
  }

  showSpinner('Converting PDF and running Docling…');
  const formData = new FormData();
  formData.append('file', fileInput.files[0]);
  formData.append('ocr_model', document.getElementById('ocr-model-select').value);

  try {
    const resp = await fetch('/process', { method: 'POST', body: formData });
    const data = await resp.json();
    hideSpinner();

    if (data.error) { toast(data.error, 'error'); setStatus(data.error, 'error'); return; }
    if (data.docling_warning) toast('⚠ ' + data.docling_warning, '');
    if (data.ocr_warning) toast('⚠ ' + data.ocr_warning, '');

    // Populate state
    state.filename    = data.filename;
    state.pdfFilename = data.pdf_filename || '';
    state.totalPages  = data.num_pages;
    state.pages = {};
    state.removedPages = new Set();
    data.pages.forEach(p => { state.pages[p.page_num] = p.elements || []; });

    // Store page image URLs
    state.pageImages = {};
    data.pages.forEach(p => { state.pageImages[p.page_num] = p.image_url; });

    // Store page dimensions
    state.pageDims = {};
    data.pages.forEach(p => { state.pageDims[p.page_num] = { width: p.width, height: p.height }; });

    document.getElementById('btn-prev').disabled = false;
    document.getElementById('btn-next').disabled = false;
    document.getElementById('btn-remove-page').disabled = false;
    document.getElementById('btn-redetect').disabled = false;
    emptyState.style.display = 'none';

    const total = Object.values(state.pages).reduce((s, a) => s + a.length, 0);
    setStatus(`Loaded: ${data.filename} (${data.num_pages} page${data.num_pages>1?'s':''}, ${total} elements)`, 'ok');

    loadPage(1);
    buildLegend();
    updateStats();

  } catch(e) {
    hideSpinner();
    toast('Error: ' + e.message, 'error');
    setStatus('Error: ' + e.message, 'error');
  }
}

// ─── Page rendering ────────────────────────────────────────────────────────────
function loadPage(n) {
  if (n < 1 || n > state.totalPages) return;
  state.currentPage = n;
  state.selectedId = null;
  updateEditPanel();

  const removed = state.removedPages.has(n);
  document.getElementById('page-info').textContent = `Page ${n} / ${state.totalPages}${removed ? ' 🗑' : ''}`;
  document.getElementById('btn-prev').disabled = n <= 1;
  document.getElementById('btn-next').disabled = n >= state.totalPages;
  document.getElementById('btn-remove-page').style.display = removed ? 'none' : '';
  document.getElementById('btn-restore-page').style.display = removed ? '' : 'none';
  document.getElementById('removed-overlay').style.display = removed ? '' : 'none';

  const url = state.pageImages[n];
  pageImg.onload = () => {
    state.imgNaturalW = pageImg.naturalWidth;
    state.imgNaturalH = pageImg.naturalHeight;
    resizeCanvas();
    renderCanvas();
    buildElementsList();
  };
  pageImg.src = url;
}

function changePage(delta) { loadPage(state.currentPage + delta); }

function resizeCanvas() {
  const r = pageImg.getBoundingClientRect();
  canvas.width  = r.width;
  canvas.height = r.height;
  canvas.style.width  = r.width  + 'px';
  canvas.style.height = r.height + 'px';
}

window.addEventListener('resize', () => {
  if (state.totalPages > 0) { resizeCanvas(); renderCanvas(); }
});

// ─── Canvas rendering ─────────────────────────────────────────────────────────
function normToCanvas(bbox) {
  const cw = canvas.width, ch = canvas.height;
  return {
    x: bbox.x1 * cw,
    y: bbox.y1 * ch,
    w: (bbox.x2 - bbox.x1) * cw,
    h: (bbox.y2 - bbox.y1) * ch,
  };
}

function renderCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const elements = state.pages[state.currentPage] || [];
  elements.forEach(el => drawElement(el, el.id === state.selectedId));
}

function drawElement(el, selected) {
  if (!el.bbox_norm) return;
  const { x, y, w, h } = normToCanvas(el.bbox_norm);
  const color = TAG_COLORS[el.label] || '#aaa';

  ctx.save();
  ctx.strokeStyle = selected ? '#fff' : color;
  ctx.lineWidth = selected ? 2.5 : 1.5;
  ctx.setLineDash(selected ? [] : []);
  ctx.strokeRect(x, y, w, h);

  // Semi-transparent fill
  ctx.fillStyle = color + (selected ? '33' : '1a');
  ctx.fillRect(x, y, w, h);

  // Label badge
  ctx.fillStyle = color;
  const label = el.label.replace('section_header_level_', 'h');
  const fontSize = 10;
  ctx.font = `bold ${fontSize}px sans-serif`;
  const tw = ctx.measureText(label).width + 6;
  const th = fontSize + 4;
  ctx.fillRect(x, y - th, tw, th);
  ctx.fillStyle = '#fff';
  ctx.fillText(label, x + 3, y - 3);

  // Table cell borders
  if (el.label === 'table') drawTableGrid(el, x, y, w, h, color);

  // Corner resize handles (selected elements only)
  if (selected) {
    const handles = [[x, y], [x + w, y], [x, y + h], [x + w, y + h]];
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    handles.forEach(([hx, hy]) => {
      ctx.fillRect(hx - 4, hy - 4, 8, 8);
      ctx.strokeRect(hx - 4, hy - 4, 8, 8);
    });
  }

  ctx.restore();
}

// ─── Table grid overlay ───────────────────────────────────────────────────────
function drawTableGrid(el, x, y, w, h, color) {
  // Prefer per-cell bounding boxes from docling when available
  if (el.table_cells && el.table_cells.length) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.75)';
    ctx.lineWidth = 1.5;
    el.table_cells.forEach(cell => {
      const { x: cx, y: cy, w: cw, h: ch } = normToCanvas(cell.bbox_norm);
      ctx.strokeRect(cx, cy, cw, ch);
    });
    ctx.restore();
    return;
  }

  // Fallback: draw an equally-spaced grid based on row/col counts from table_html
  if (!el.table_html) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = el.table_html;
  const rows = tmp.querySelectorAll('tr');
  if (!rows.length) return;
  const numRows = rows.length;
  let numCols = 0;
  rows.forEach(row => {
    let cols = 0;
    row.querySelectorAll('td,th').forEach(cell => {
      cols += parseInt(cell.getAttribute('colspan') || 1);
    });
    numCols = Math.max(numCols, cols);
  });
  if (numCols < 1) return;

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([]);
  for (let r = 1; r < numRows; r++) {
    const ry = y + h * r / numRows;
    ctx.beginPath(); ctx.moveTo(x, ry); ctx.lineTo(x + w, ry); ctx.stroke();
  }
  for (let c = 1; c < numCols; c++) {
    const rx = x + w * c / numCols;
    ctx.beginPath(); ctx.moveTo(rx, y); ctx.lineTo(rx, y + h); ctx.stroke();
  }
  ctx.restore();
}

// ─── Hit-testing ──────────────────────────────────────────────────────────────
function canvasToNorm(cx, cy) {
  return { x: cx / canvas.width, y: cy / canvas.height };
}

// ─── Resize helpers ───────────────────────────────────────────────────────────
const RESIZE_HIT_PX = 8;
const CORNER_CURSORS = { nw: 'nw-resize', ne: 'ne-resize', sw: 'sw-resize', se: 'se-resize' };

function getResizeCorner(el, cx, cy) {
  if (!el || !el.bbox_norm) return null;
  const { x, y, w, h } = normToCanvas(el.bbox_norm);
  const corners = [
    { name: 'nw', px: x,     py: y     },
    { name: 'ne', px: x + w, py: y     },
    { name: 'sw', px: x,     py: y + h },
    { name: 'se', px: x + w, py: y + h },
  ];
  for (const c of corners) {
    if (Math.abs(cx - c.px) <= RESIZE_HIT_PX && Math.abs(cy - c.py) <= RESIZE_HIT_PX) return c.name;
  }
  return null;
}

function getElementAtPoint(nx, ny) {
  const elements = [...(state.pages[state.currentPage] || [])].reverse(); // top-most first
  for (const el of elements) {
    const b = el.bbox_norm;
    if (!b) continue;
    if (nx >= b.x1 && nx <= b.x2 && ny >= b.y1 && ny <= b.y2) return el;
  }
  return null;
}

// ─── Canvas mouse events ───────────────────────────────────────────────────────
canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  const { x: nx, y: ny } = canvasToNorm(cx, cy);

  if (state.mode === 'select') {
    // Check for corner resize handle on the currently selected element first
    if (state.selectedId) {
      const selEl = getCurrentPageElement(state.selectedId);
      const corner = getResizeCorner(selEl, cx, cy);
      if (corner) {
        state.resizing = true;
        state.resizeCorner = corner;
        canvas.style.cursor = CORNER_CURSORS[corner];
        e.preventDefault();
        return;
      }
    }
    const el = getElementAtPoint(nx, ny);
    if (el) selectElement(el.id);
    else deselectElement();
    renderCanvas();

  } else if (state.mode === 'draw') {
    state.drawing = true;
    state.drawStart = { nx, ny };
  }
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  const { x: nx, y: ny } = canvasToNorm(cx, cy);

  // ── Resize in progress ──────────────────────────────────────────────────────
  if (state.resizing) {
    const el = getCurrentPageElement(state.selectedId);
    if (el && el.bbox_norm) {
      const b = { ...el.bbox_norm };
      if (state.resizeCorner === 'nw')      { b.x1 = nx; b.y1 = ny; }
      else if (state.resizeCorner === 'ne') { b.x2 = nx; b.y1 = ny; }
      else if (state.resizeCorner === 'sw') { b.x1 = nx; b.y2 = ny; }
      else if (state.resizeCorner === 'se') { b.x2 = nx; b.y2 = ny; }
      el.bbox_norm = {
        x1: Math.max(0, Math.min(1, Math.min(b.x1, b.x2))),
        y1: Math.max(0, Math.min(1, Math.min(b.y1, b.y2))),
        x2: Math.max(0, Math.min(1, Math.max(b.x1, b.x2))),
        y2: Math.max(0, Math.min(1, Math.max(b.y1, b.y2))),
      };
      renderCanvas();
      // Update bbox fields without rebuilding the whole form
      document.getElementById('bbox-x1').value = el.bbox_norm.x1;
      document.getElementById('bbox-y1').value = el.bbox_norm.y1;
      document.getElementById('bbox-x2').value = el.bbox_norm.x2;
      document.getElementById('bbox-y2').value = el.bbox_norm.y2;
    }
    return;
  }

  // ── Cursor update in select mode ─────────────────────────────────────────────
  if (state.mode === 'select' && state.selectedId) {
    const selEl = getCurrentPageElement(state.selectedId);
    const corner = getResizeCorner(selEl, cx, cy);
    canvas.style.cursor = corner ? CORNER_CURSORS[corner] : 'default';
  }

  if (!state.drawing) return;

  renderCanvas();
  // Draw preview rect
  const s = state.drawStart;
  const x1 = Math.min(s.nx, nx), y1 = Math.min(s.ny, ny);
  const x2 = Math.max(s.nx, nx), y2 = Math.max(s.ny, ny);
  const { x, y, w, h } = normToCanvas({ x1, y1, x2, y2 });
  ctx.save();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 4]);
  ctx.strokeRect(x, y, w, h);
  ctx.restore();
});

canvas.addEventListener('mouseup', e => {
  // ── Commit resize ────────────────────────────────────────────────────────────
  if (state.resizing) {
    state.resizing = false;
    state.resizeCorner = null;
    canvas.style.cursor = state.mode === 'draw' ? 'crosshair' : 'default';
    const el = getCurrentPageElement(state.selectedId);
    if (el) updateEditPanel(el);
    buildElementsList();
    updateStats();
    renderCanvas();
    return;
  }

  if (!state.drawing) return;
  state.drawing = false;

  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  const { x: nx, y: ny } = canvasToNorm(cx, cy);
  const s = state.drawStart;

  const x1 = Math.round(Math.min(s.nx, nx) * 1000) / 1000;
  const y1 = Math.round(Math.min(s.ny, ny) * 1000) / 1000;
  const x2 = Math.round(Math.max(s.nx, nx) * 1000) / 1000;
  const y2 = Math.round(Math.max(s.ny, ny) * 1000) / 1000;

  if (x2 - x1 < 0.005 || y2 - y1 < 0.005) { renderCanvas(); return; } // Too small

  const newEl = {
    id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`,
    label: ALL_TAGS[0],
    content: '',
    bbox_norm: { x1, y1, x2, y2 },
  };

  if (!state.pages[state.currentPage]) state.pages[state.currentPage] = [];
  state.pages[state.currentPage].push(newEl);

  selectElement(newEl.id);
  renderCanvas();
  buildElementsList();
  switchTab('edit');
  updateStats();
});

canvas.addEventListener('mouseleave', () => {
  if (state.resizing) {
    state.resizing = false;
    state.resizeCorner = null;
    canvas.style.cursor = state.mode === 'draw' ? 'crosshair' : 'default';
    const el = getCurrentPageElement(state.selectedId);
    if (el) updateEditPanel(el);
    renderCanvas();
  }
  if (state.drawing) { state.drawing = false; renderCanvas(); }
});

// ─── Element selection & editing ──────────────────────────────────────────────
function selectElement(id, opts) {
  // opts: { switchToEdit: bool (default true), scrollList: bool (default true) }
  const { switchToEdit = true, scrollList = true } = opts || {};
  state.selectedId = id;
  const el = getCurrentPageElement(id);
  if (!el) return;

  // Highlight in list
  document.querySelectorAll('.element-item').forEach(li => li.classList.toggle('selected', li.dataset.id === id));

  // Scroll the selected list item into view
  if (scrollList) {
    const li = document.querySelector(`.element-item[data-id="${CSS.escape(id)}"]`);
    if (li) li.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  updateEditPanel(el);
  if (switchToEdit) switchTab('edit');
}

function deselectElement() {
  state.selectedId = null;
  updateEditPanel(null);
  document.querySelectorAll('.element-item').forEach(li => li.classList.remove('selected'));
  renderCanvas();
}

function getCurrentPageElement(id) {
  return (state.pages[state.currentPage] || []).find(e => e.id === id) || null;
}

function updateEditPanel(el) {
  const noSel = document.getElementById('no-selection');
  const form  = document.getElementById('edit-form');
  if (!el) {
    noSel.style.display = ''; form.style.display = 'none';
    document.getElementById('table-preview').style.display = 'none';
    return;
  }
  noSel.style.display = 'none'; form.style.display = '';

  // Populate label select with grouped optgroups
  const sel = document.getElementById('edit-label');
  const coveredTags2 = TAG_GROUPS.flatMap(g => g.tags);
  const remaining2   = ALL_TAGS.filter(t => !coveredTags2.includes(t));
  const selGroups = remaining2.length
    ? [...TAG_GROUPS, { header: 'Other', tags: remaining2 }]
    : TAG_GROUPS;
  sel.innerHTML = selGroups.map(g => {
    const opts = g.tags.filter(t => ALL_TAGS.includes(t));
    if (!opts.length) return '';
    return `<optgroup label="${g.header}">${opts.map(t => `<option value="${t}"${t === el.label ? ' selected' : ''}>${t}</option>`).join('')}</optgroup>`;
  }).join('');

  document.getElementById('edit-content').value = el.content || '';
  const b = el.bbox_norm || {};
  document.getElementById('bbox-x1').value = b.x1 ?? 0;
  document.getElementById('bbox-y1').value = b.y1 ?? 0;
  document.getElementById('bbox-x2').value = b.x2 ?? 1;
  document.getElementById('bbox-y2').value = b.y2 ?? 1;

  // Table preview
  renderTablePreview(el);
}

function applyEdit() {
  if (!state.selectedId) { toast('No element selected.', 'error'); return; }
  const el = getCurrentPageElement(state.selectedId);
  if (!el) return;

  el.label   = document.getElementById('edit-label').value;
  el.content = document.getElementById('edit-content').value;
  el.bbox_norm = {
    x1: parseFloat(document.getElementById('bbox-x1').value) || 0,
    y1: parseFloat(document.getElementById('bbox-y1').value) || 0,
    x2: parseFloat(document.getElementById('bbox-x2').value) || 1,
    y2: parseFloat(document.getElementById('bbox-y2').value) || 1,
  };

  renderCanvas();
  buildElementsList();
  updateStats();
  toast('Element updated.', 'success');
}

function deleteSelected() {
  if (!state.selectedId) { toast('No element selected.', 'error'); return; }
  const page = state.pages[state.currentPage];
  state.pages[state.currentPage] = page.filter(e => e.id !== state.selectedId);
  state.selectedId = null;
  updateEditPanel(null);
  renderCanvas();
  buildElementsList();
  updateStats();
  toast('Element deleted.', 'success');
}

function addElement() {
  if (!state.totalPages) { toast('Load a PDF first.', 'error'); return; }
  toast('Draw mode active – drag on the page to create an element.', '');
  setMode('draw');
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      if (state.selectedId) { deleteSelected(); e.preventDefault(); }
    }
  }
  if (e.key === 'Escape') deselectElement();
  if (e.key === 'ArrowLeft')  { changePage(-1); e.preventDefault(); }
  if (e.key === 'ArrowRight') { changePage(1);  e.preventDefault(); }
});

// ─── Elements list ─────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function buildElementsList() {
  const list = document.getElementById('elements-list');
  const elements = state.pages[state.currentPage] || [];
  if (!elements.length) {
    list.innerHTML = '<p style="color:var(--text2);font-size:.82rem">No elements on this page.</p>';
    return;
  }
  list.innerHTML = elements.map(el => {
    const color = TAG_COLORS[el.label] || '#aaa';
    const labelShort = escHtml(el.label.replace('section_header_level_','h'));
    const preview = escHtml((el.content || '').slice(0, 60));
    const selected = el.id === state.selectedId ? ' selected' : '';
    return `<div class="element-item${selected}" data-id="${escHtml(el.id)}">
      <span class="el-label" style="background:${escHtml(color)}">${labelShort}</span>
      <div class="el-content">${preview || '<em style="color:var(--text2)">empty</em>'}</div>
    </div>`;
  }).join('');
}

// Use event delegation for element list clicks (avoids inline onclick XSS)
document.getElementById('elements-list').addEventListener('click', e => {
  const item = e.target.closest('.element-item');
  if (item && item.dataset.id) {
    // Stay on elements tab when clicking from list; don't auto-switch to edit
    selectElement(item.dataset.id, { switchToEdit: false, scrollList: false });
    renderCanvas();
  }
});

// ─── Legend ───────────────────────────────────────────────────────────────────
const TAG_GROUPS = [
  { header: 'Section Headers', tags: ['section_header_level_1', 'section_header_level_2', 'section_header_level_3'] },
  { header: 'Text Content',    tags: ['text', 'list_item', 'caption', 'footnote', 'code'] },
  { header: 'Document',        tags: ['title', 'formula'] },
  { header: 'Visual',          tags: ['picture', 'table'] },
  { header: 'Page Layout',     tags: ['page_header', 'page_footer'] },
];

function buildLegend() {
  const lg = document.getElementById('legend');
  const coveredTags = TAG_GROUPS.flatMap(g => g.tags);
  const remaining   = ALL_TAGS.filter(t => !coveredTags.includes(t));
  const groups = remaining.length
    ? [...TAG_GROUPS, { header: 'Other', tags: remaining }]
    : TAG_GROUPS;

  lg.innerHTML = groups.map(g => {
    const tagsInGroup = g.tags.filter(t => ALL_TAGS.includes(t));
    if (!tagsInGroup.length) return '';
    const header = `<div class="legend-section-header">${g.header}</div>`;
    const rows = tagsInGroup.map(t => {
      const c = TAG_COLORS[t] || '#aaa';
      return `<div class="legend-row"><div class="legend-color" style="background:${c}"></div><span>${t}</span></div>`;
    }).join('');
    return header + rows;
  }).join('');
}

// ─── Stats ────────────────────────────────────────────────────────────────────
function updateStats() {
  const counts = {};
  let total = 0;
  Object.values(state.pages).forEach(elems => {
    elems.forEach(el => {
      counts[el.label] = (counts[el.label] || 0) + 1;
      total++;
    });
  });

  let html = `<p><strong>Total elements:</strong> ${total}</p>
              <p><strong>Pages:</strong> ${state.totalPages}</p><br>`;
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  sorted.forEach(([lbl, cnt]) => {
    const c = TAG_COLORS[lbl] || '#aaa';
    html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
               <div class="legend-color" style="background:${c}"></div>
               <span>${lbl}</span>
               <strong style="margin-left:auto">${cnt}</strong>
             </div>`;
  });
  document.getElementById('stats-content').innerHTML = html;
}

// ─── Save annotations ─────────────────────────────────────────────────────────
async function saveAnnotations() {
  if (!state.filename) { toast('No document loaded.', 'error'); return; }

  // Build per-page payload with image name and dimensions (skip removed pages)
  const pagesPayload = {};
  Object.keys(state.pages).forEach(pageNum => {
    if (state.removedPages.has(parseInt(pageNum))) return;
    const imgUrl = state.pageImages[pageNum] || '';
    const imgName = imgUrl.replace(/^.*\//, '').replace(/\.[^.]+$/, '');
    const dims = state.pageDims[pageNum] || {};
    pagesPayload[pageNum] = {
      image_name: imgName,
      width: dims.width || 0,
      height: dims.height || 0,
      elements: state.pages[pageNum] || [],
    };
  });

  showSpinner('Saving annotations…');
  try {
    const resp = await fetch('/save_annotations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: state.filename, pages: pagesPayload }),
    });
    const data = await resp.json();
    hideSpinner();
    if (data.success) {
      // Show persistent save-path info panel
      const pathInfo = document.getElementById('save-path-info');
      const pathText = document.getElementById('save-path-text');
      state._lastSavedPath = data.saved_to;
      pathText.textContent = data.saved_to_rel || data.saved_to;
      pathInfo.style.display = '';
      const pageCount = data.num_pages || 1;
      toast(`✔ Saved ${data.num_elements} elements (${pageCount} page file${pageCount > 1 ? 's' : ''})`, 'success');
    } else {
      toast('Save failed: ' + (data.error || 'unknown error'), 'error');
    }
  } catch(e) {
    hideSpinner();
    toast('Save error: ' + e.message, 'error');
  }
}

function copyPath() {
  const path = state._lastSavedPath || '';
  if (!path) return;
  navigator.clipboard.writeText(path).then(
    () => toast('Path copied to clipboard', 'success'),
    () => toast('Copy failed – see save panel for path', 'error')
  );
}

// ─── Table preview ────────────────────────────────────────────────────────────
function renderTablePreview(el) {
  const container = document.getElementById('table-preview');
  const content   = document.getElementById('table-preview-content');
  const body      = document.getElementById('table-preview-body');
  const toggle    = document.getElementById('table-preview-toggle');

  if (!el || el.label !== 'table') {
    container.style.display = 'none';
    return;
  }
  container.style.display = '';
  // Always expand when a table element is selected
  body.style.display = '';
  toggle.textContent = '▲ hide';

  if (el.table_html) {
    // Backend provided full cell-grid HTML (with colspan/rowspan)
    content.innerHTML = el.table_html;
  } else {
    // Fallback: parse markdown table from content field
    const html = markdownTableToHtml(el.content || '');
    if (html) {
      content.innerHTML = html;
    } else {
      content.innerHTML = `<span class="table-preview-empty">No structured table data available.<br>Raw content shown in the textarea above.</span>`;
    }
  }
}

function toggleTablePreview() {
  const body   = document.getElementById('table-preview-body');
  const toggle = document.getElementById('table-preview-toggle');
  const shown  = body.style.display !== 'none';
  body.style.display = shown ? 'none' : '';
  toggle.textContent = shown ? '▼ show' : '▲ hide';
}

function markdownTableToHtml(md) {
  const lines = md.split('\n').map(l => l.trim()).filter(l => l);
  if (!lines.length || !lines[0].startsWith('|')) return '';

  let html = '<table>';
  let headerDone = false;

  for (const line of lines) {
    if (!line.startsWith('|')) break;
    // Separator row – matches patterns like |---|---| or |:--|--:|
    if (/^\|[\s\-:|]+\|$/.test(line)) { headerDone = true; continue; }

    const tag = !headerDone ? 'th' : 'td';
    const cells = line.split('|').slice(1, -1);
    html += '<tr>' + cells.map(c => `<${tag}>${escHtml(c.trim())}</${tag}>`).join('') + '</tr>';
    if (!headerDone) headerDone = true;
  }

  html += '</table>';
  return html === '<table></table>' ? '' : html;
}

// ─── Page remove / restore ────────────────────────────────────────────────────
function removePage() {
  if (!state.totalPages) return;
  const page = state.currentPage;
  state.removedPages.add(page);
  toast(`Page ${page} marked as removed (excluded from save/export).`, 'success');
  loadPage(page);  // reload to show removed overlay
  updateStats();
}

function restorePage() {
  if (!state.totalPages) return;
  const page = state.currentPage;
  state.removedPages.delete(page);
  toast(`Page ${page} restored.`, 'success');
  loadPage(page);
  updateStats();
}

// ─── Export XML ───────────────────────────────────────────────────────────────
async function exportXML() {
  if (!state.filename) { toast('No document loaded.', 'error'); return; }

  const pagesPayload = {};
  Object.keys(state.pages).forEach(pageNum => {
    if (state.removedPages.has(parseInt(pageNum))) return;
    const imgUrl = state.pageImages[pageNum] || '';
    const imgName = imgUrl.replace(/^.*\//, '').replace(/\.[^.]+$/, '');
    const dims = state.pageDims[pageNum] || {};
    pagesPayload[pageNum] = {
      image_name: imgName,
      width: dims.width || 0,
      height: dims.height || 0,
      elements: state.pages[pageNum] || [],
    };
  });

  showSpinner('Saving XML annotations…');
  try {
    const resp = await fetch('/export_xml', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: state.filename, pages: pagesPayload }),
    });
    const data = await resp.json();
    hideSpinner();
    if (data.success) {
      const pathInfo = document.getElementById('save-path-info');
      const pathText = document.getElementById('save-path-text');
      state._lastSavedPath = data.saved_to;
      pathText.textContent = (data.saved_to_rel || data.saved_to) + ` (${data.num_pages} file${data.num_pages > 1 ? 's' : ''})`;
      pathInfo.style.display = '';
      toast(`✔ XML saved: ${data.num_pages} page file${data.num_pages > 1 ? 's' : ''} in xml_annotations/`, 'success');
    } else {
      toast('XML save failed: ' + (data.error || 'unknown error'), 'error');
    }
  } catch(e) {
    hideSpinner();
    toast('XML save error: ' + e.message, 'error');
  }
}

// ─── Table re-detection ───────────────────────────────────────────────────────
function bboxOverlap(a, b) {
  if (!a || !b) return 0;
  const ix1 = Math.max(a.x1, b.x1), iy1 = Math.max(a.y1, b.y1);
  const ix2 = Math.min(a.x2, b.x2), iy2 = Math.min(a.y2, b.y2);
  if (ix2 <= ix1 || iy2 <= iy1) return 0;
  const inter = (ix2 - ix1) * (iy2 - iy1);
  const aArea = (a.x2 - a.x1) * (a.y2 - a.y1);
  const bArea = (b.x2 - b.x1) * (b.y2 - b.y1);
  return inter / Math.min(aArea || 1, bArea || 1);
}

async function redetectTables() {
  if (!state.totalPages || !state.pdfFilename) { toast('Load a PDF first.', 'error'); return; }

  showSpinner(`Re-detecting tables on page ${state.currentPage}…`);
  try {
    const resp = await fetch('/redetect_tables', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pdf_filename: state.pdfFilename, page_no: state.currentPage }),
    });
    const data = await resp.json();
    if (data.error) { toast(data.error, 'error'); return; }

    const newTables = data.tables || [];
    if (!newTables.length) { toast('No new tables detected on this page.', ''); return; }

    const existing = state.pages[state.currentPage] || [];
    let added = 0;
    for (const t of newTables) {
      const overlaps = existing.some(e =>
        e.label === 'table' && bboxOverlap(e.bbox_norm, t.bbox_norm) > 0.5
      );
      if (!overlaps) { existing.push(t); added++; }
    }
    state.pages[state.currentPage] = existing;

    renderCanvas();
    buildElementsList();
    updateStats();
    toast(`Re-detection: ${added} new table${added !== 1 ? 's' : ''} added.`, added ? 'success' : '');
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  } finally {
    hideSpinner();
  }
}

// ─── OCR on selected region ───────────────────────────────────────────────────
async function ocrRegion() {
  if (!state.selectedId) { toast('Select an element first.', 'error'); return; }
  const el = getCurrentPageElement(state.selectedId);
  if (!el || !el.bbox_norm) { toast('Selected element has no bounding box.', 'error'); return; }

  const imgUrl = state.pageImages[state.currentPage] || '';
  const imgFilename = imgUrl.replace(/^.*\//, '');
  if (!imgFilename) { toast('Page image not available.', 'error'); return; }

  showSpinner('Running Google OCR on region…');
  try {
    const resp = await fetch('/ocr_region', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image_filename: imgFilename, bbox_norm: el.bbox_norm }),
    });
    const data = await resp.json();
    hideSpinner();
    if (data.error) { toast('OCR failed: ' + data.error, 'error'); return; }
    const text = data.text || '';
    if (!text) { toast('No text recognised in this region.', 'warning'); return; }
    document.getElementById('edit-content').value = text;
    toast('OCR complete – text inserted into content field.', 'success');
  } catch(e) {
    hideSpinner();
    toast('OCR error: ' + e.message, 'error');
  }
}


(function initResizeHandle() {
  const handle  = document.getElementById('resize-handle');
  const sidebar = document.getElementById('sidebar');
  let dragging  = false;
  let startX, startW;

  handle.addEventListener('mousedown', e => {
    dragging = true;
    startX   = e.clientX;
    startW   = sidebar.getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.body.style.cursor    = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const delta = startX - e.clientX;   // moving left = bigger sidebar
    const newW  = Math.max(240, Math.min(700, startW + delta));
    sidebar.style.width = newW + 'px';
    if (state.totalPages > 0) { resizeCanvas(); renderCanvas(); }
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor     = '';
    document.body.style.userSelect = '';
  });
})();
